
name: Build Asystent Instalatora APK

on:
  push:
    paths:
      - 'asystent_instalatora_android_ci.zip'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract application project
        run: |
          unzip -q asystent_instalatora_android_ci.zip -d app-src

          PROJECT_DIR="$(dirname "$(find app-src -name package.json -not -path '*/node_modules/*' -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Nie znaleziono package.json"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projekt: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK 35
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Update Android build configuration
        run: |
          cd "$PROJECT_DIR/android"

          sed -i \
            "s/compileSdkVersion = 34/compileSdkVersion = 35/" \
            build.gradle

          sed -i \
            "s/com.android.tools.build:gradle:8.2.1/com.android.tools.build:gradle:8.6.1/" \
            build.gradle

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          cd "$PROJECT_DIR"
          node tools/check-syntax.js

      - name: Check project integrity
        run: |
          cd "$PROJECT_DIR"
          node tools/check-project-integrity.js

      - name: Test Buderus catalog
        run: |
          cd "$PROJECT_DIR"
          node tests/buderus_catalog.test.js

      - name: Synchronize Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Add AndroidX dependencies
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "android/app/build.gradle"
          s = p.read_text()

          needle = "    implementation project(':capacitor-android')"

          dependencies = """
              implementation "androidx.appcompat:appcompat:${rootProject.ext.androidxAppCompatVersion}"
              implementation "androidx.core:core:${rootProject.ext.androidxCoreVersion}"
              implementation "androidx.coordinatorlayout:coordinatorlayout:${rootProject.ext.androidxCoordinatorLayoutVersion}"
          """

          if "androidx.appcompat:appcompat" not in s:
              if needle not in s:
                  raise SystemExit("Nie znaleziono miejsca do dodania zależności")
              s = s.replace(needle, needle + "\n" + dependencies)

          p.write_text(s)
          print("Dodano zależności AndroidX")
          PY

      - name: Fix AppCompat launch theme and verify Android entry point
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          styles = root / "android/app/src/main/res/values/styles.xml"
          manifest = root / "android/app/src/main/AndroidManifest.xml"

          if not styles.exists() or not manifest.exists():
              raise SystemExit("Brak styles.xml lub AndroidManifest.xml")

          content = styles.read_text()
          content = content.replace(
              'parent="android:style/Theme.Material.Light.NoActionBar"',
              'parent="Theme.AppCompat.Light.NoActionBar"'
          )
          if 'parent="Theme.AppCompat.Light.NoActionBar"' not in content:
              raise SystemExit("Nie udało się ustawić motywu AppCompat")
          styles.write_text(content)

          xml = manifest.read_text()
          if 'android:theme="@style/AppTheme.NoActionBar"' not in xml:
              raise SystemExit("MainActivity nie wskazuje AppTheme.NoActionBar")
          print("Motyw AppCompat ustawiony i zweryfikowany.")
          PY

      - name: Apply requested navigation and schematic access changes
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          ui = root / "www/js/ui.js"
          pro = root / "www/js/pro.js"

          s = ui.read_text()
          old = """const NAV = [
            { k: 'calc', label: 'Kalkulatory', icon: 'calc' },
            { k: 'offers', label: 'Biuro', icon: 'doc' },
            { k: 'ai', label: 'Asystent', icon: 'spark' },
            { k: 'settings', label: 'Ustawienia', icon: 'gear' },
          ];"""
          new = """const NAV = [
            { k: 'offers', label: 'Biuro', icon: 'doc' },
            { k: 'ai', label: 'Asystent', icon: 'spark' },
            { k: 'calc', label: 'Kalkulatory', icon: 'calc' },
            { k: 'settings', label: 'Ustawienia', icon: 'gear' },
          ];"""
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit("Nie rozpoznano dotychczasowej nawigacji")
          ui.write_text(s)

          s = pro.read_text()
          old = "const PRO_KALK = ['co_dia', 'rozdz_dia', 'woda_dia', 'gas', 'kotlownia'];"
          new = "// Schemat kotłowni pozostaje dostępny bez abonamentu — podstawowe narzędzie projektowe.\nconst PRO_KALK = ['co_dia', 'rozdz_dia', 'woda_dia', 'gas'];"
          if old in s:
              s = s.replace(old, new)
          elif new not in s:
              raise SystemExit("Nie rozpoznano listy kalkulatorów premium")
          pro.write_text(s)

          nav = ui.read_text()
          if not (nav.index("{ k: 'offers'") < nav.index("{ k: 'ai'") < nav.index("{ k: 'calc'") < nav.index("{ k: 'settings'")):
              raise SystemExit("Kolejność zakładek nieprawidłowa")
          if "const PRO_KALK = ['co_dia', 'rozdz_dia', 'woda_dia', 'gas'];" not in pro.read_text():
              raise SystemExit("Schemat kotłowni nadal objęty blokadą")
          print("OK: Biuro → Asystent → Kalkulatory → Ustawienia; tworzenie schematu kotłowni bez abonamentu.")
          PY

      - name: Remove all remaining feature and subscription locks
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          p = Path(os.environ["PROJECT_DIR"]) / "www/js/pro.js"
          s = p.read_text()

          replacements = {
              "function proMa() { return !!state.pro.aktywny; }":
                  "function proMa() { return true; }",
              "function proPlatny(id) { return PRO_KALK.indexOf(id) !== -1; }":
                  "function proPlatny(id) { return false; }",
              "function proPodglad(id) { return proPlatny(id) && !proMa(); }":
                  "function proPodglad(id) { return false; }",
              "function proEkranPodgladu() {":
                  "function proEkranPodgladu() {\n  return false; // Wszystkie funkcje aplikacji są odblokowane.",
              "function proDoPlatnego(t) {":
                  "function proDoPlatnego(t) { return false; // Brak blokad przejść między modułami.\n  /*",
          }

          for old, new in replacements.items():
              if old not in s:
                  if new not in s:
                      raise SystemExit("Nie znaleziono oczekiwanego punktu blokady: " + old)
              else:
                  s = s.replace(old, new, 1)

          # Usuń pozostałą część starej funkcji proDoPlatnego z parsowania,
          # pozostawiając ją jako nieaktywny komentarz aż do jej zamykającej klamry.
          marker = "function proDoPlatnego(t) { return false; // Brak blokad przejść między modułami.\n  /*"
          if marker in s:
              start = s.index(marker)
              end_marker = "\ndocument.addEventListener('click', e => {\n  if (proMa() || !proDoPlatnego(e.target)) return;"
              end = s.find(end_marker, start)
              if end < 0:
                  raise SystemExit("Nie udało się odseparować starej blokady przejść")
              s = s[:start] + "function proDoPlatnego(t) { return false; }\n" + s[end:]

          # Nie pokazuj abonamentu ani przycisków zakupu w Ustawieniach.
          start_marker = "/* ---------- abonament w Ustawieniach ----------"
          end_marker = "/* ---------- drzwi z darmowej części do płatnej ----------"
          if start_marker in s and end_marker in s:
              a = s.index(start_marker)
              b = s.index(end_marker, a)
              s = s[:a] + "/* Abonament wyłączony — aplikacja działa w pełnym zakresie bez zakupów. */\n" + s[b:]
          else:
              raise SystemExit("Nie znaleziono sekcji abonamentu w Ustawieniach")

          # Usuń historyczny przykładowy projekt demonstracyjny; nie może
          # być mylony z projektem użytkownika po odblokowaniu tworzenia.
          s = s.replace(
              "function proUstawPrzyklad() {\n  const i = state.projekty.findIndex(x => x.przyklad);\n  if (!proMa()) { if (i < 0) state.projekty.unshift(proProjekt()); }\n  else if (i >= 0) {",
              "function proUstawPrzyklad() {\n  const i = state.projekty.findIndex(x => x.przyklad);\n  if (i >= 0) {"
          )

          checks = [
              "function proMa() { return true; }",
              "function proPlatny(id) { return false; }",
              "function proPodglad(id) { return false; }",
              "function proDoPlatnego(t) { return false; }",
              "function proEkranPodgladu() {\n  return false;"
          ]
          for c in checks:
              if c not in s:
                  raise SystemExit("Kontrola odblokowania nie przeszła: " + c)
          p.write_text(s)
          print("OK: usunięto blokady kalkulatorów, edycji Biura, projektów i przejść między modułami; ukryto zakup abonamentu.")
          PY

      - name: Add partial delivery tracking to sales register
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          p = root / "www/js/ui_offers.js"
          s = p.read_text()

          needle = """function salesRemaining(sale) {
            return Math.max(0, (Number(sale && sale.gross) || 0) - salesPaidTotal(sale));
          }
          """
          helpers = needle + """function salesDeliveredForLine(sale, lineIndex) {
            const events = Array.isArray(sale && sale.deliveries) ? sale.deliveries : [];
            return events.filter(x => Number(x.lineIndex) === Number(lineIndex))
              .reduce((sum, x) => sum + (Number(x.qty) || 0), 0);
          }
          function salesLineRemaining(sale, lineIndex) {
            const line = Array.isArray(sale && sale.lines) ? sale.lines[lineIndex] : null;
            return Math.max(0, (Number(line && line.qty) || 0) - salesDeliveredForLine(sale, lineIndex));
          }
          function salesDeliveryProgress(sale) {
            const lines = Array.isArray(sale && sale.lines) ? sale.lines : [];
            if (!lines.length) return null;
            const required = lines.reduce((sum, line) => sum + Math.max(0, Number(line.qty) || 0), 0);
            const delivered = lines.reduce((sum, line, i) => sum + salesDeliveredForLine(sale, i), 0);
            return { required, delivered, remaining: Math.max(0, required - delivered), complete: required > 0 && delivered >= required };
          }
          function salesAddDelivery(sale, lineIndex, qty, date, note) {
            if (!sale || !Array.isArray(sale.lines) || !Number.isInteger(lineIndex) || !sale.lines[lineIndex]) throw new Error('Wybierz prawidłową pozycję dostawy.');
            const amount = Number(qty);
            if (!Number.isFinite(amount) || amount <= 0) throw new Error('Podaj ilość dostawy większą od zera.');
            const remaining = salesLineRemaining(sale, lineIndex);
            if (amount > remaining + 0.000001) throw new Error('Ilość przekracza pozostałą dostawę: ' + remaining + '.');
            sale.deliveries = Array.isArray(sale.deliveries) ? sale.deliveries : [];
            sale.deliveries.push({ id: 'delivery_' + Date.now() + '_' + Math.random().toString(36).slice(2,7), lineIndex, qty: amount,
              date: String(date || new Date().toISOString().slice(0,10)), note: String(note || '').trim().slice(0,160), createdAt: new Date().toISOString() });
            const progress = salesDeliveryProgress(sale);
            sale.delivery = progress.complete ? 'Dostarczone' : 'Częściowo dostarczone';
            sale.updatedAt = new Date().toISOString();
            return progress;
          }
          """
          if "function salesAddDelivery(sale, lineIndex, qty, date, note)" not in s:
              if needle not in s:
                  raise SystemExit("Nie znaleziono miejsca na funkcje dostaw częściowych")
              s = s.replace(needle, helpers, 1)

          old_ui = """        ${x.lines && x.lines.length ? `<small>Pozycje: ${x.lines.map(l=>esc(l.name)+' × '+Number(l.qty||0)).join(' · ')}</small>` : ''}
                  ${x.lines && x.lines.length && !x.stockIssued ? `<div class="sales-actions"><button class="btn2" data-salesissue="${esc(x.id)}">Wydaj z magazynu</button></div>` : ''}
          """
          new_ui = """        ${x.lines && x.lines.length ? `<small>Pozycje: ${x.lines.map(l=>esc(l.name)+' × '+Number(l.qty||0)).join(' · ')}</small>` : ''}
                  ${x.lines && x.lines.length ? (() => { const d=salesDeliveryProgress(x); return `<div class="payment-history"><strong>Realizacja dostaw: ${d.delivered} / ${d.required} szt.</strong>${x.lines.map((l,i)=>`<small>${esc(l.name)} — dostarczono: ${salesDeliveredForLine(x,i)} / ${Number(l.qty)||0} ${esc(l.unit||'szt.')} · pozostało ${salesLineRemaining(x,i)}</small>`).join('')}${d.complete?'<small class="ok-txt">Wszystkie pozycje dostarczone</small>':''}${(x.deliveries||[]).length?`<small>Historia dostaw:</small>${x.deliveries.map(ev=>`<small>${ev.date?plDate(ev.date):'—'} · ${esc(x.lines[ev.lineIndex]?.name||'Pozycja')} × ${Number(ev.qty)||0}${ev.note?' · '+esc(ev.note):''}</small>`).join('')}`:''}</div>`; })() : ''}
                  ${x.lines && x.lines.length && salesDeliveryProgress(x).remaining > 0 ? `<div class="sales-actions"><select data-salesdeliveryline="${esc(x.id)}">${x.lines.map((l,i)=>`<option value="${i}" ${salesLineRemaining(x,i)<=0?'disabled':''}>${esc(l.name)} — pozostało ${salesLineRemaining(x,i)}</option>`).join('')}</select><input type="number" min="0.01" step="0.01" placeholder="Ilość" data-salesdeliveryqty="${esc(x.id)}" style="max-width:95px"><input type="date" data-salesdeliverydate="${esc(x.id)}" value="${new Date().toISOString().slice(0,10)}" style="max-width:145px"><input type="text" placeholder="Nr WZ / uwagi" data-salesdeliverynote="${esc(x.id)}" style="max-width:130px"><button class="btn2" data-salesdelivery="${esc(x.id)}">Zapisz dostawę</button></div>` : ''}
                  ${x.lines && x.lines.length && !x.stockIssued ? `<div class="sales-actions"><button class="btn2" data-salesissue="${esc(x.id)}">Wydaj z magazynu</button></div>` : ''}
          """
          if "data-salesdeliveryline" not in s:
              if old_ui not in s:
                  raise SystemExit("Nie znaleziono miejsca na panel dostaw w karcie sprzedaży")
              s = s.replace(old_ui, new_ui, 1)

          event_anchor = "  const salesIssue = e.target.closest('[data-salesissue]');"
          event_code = """  const salesDelivery = e.target.closest('[data-salesdelivery]');
            if (salesDelivery) {
              const id = salesDelivery.dataset.salesdelivery;
              const sale = state.salesRecords.find(x => x.id === id);
              const lineEl = document.querySelector(`[data-salesdeliveryline="${id}"]`);
              const qtyEl = document.querySelector(`[data-salesdeliveryqty="${id}"]`);
              const dateEl = document.querySelector(`[data-salesdeliverydate="${id}"]`);
              const noteEl = document.querySelector(`[data-salesdeliverynote="${id}"]`);
              try {
                const progress = salesAddDelivery(sale, Number(lineEl && lineEl.value), Number(qtyEl && qtyEl.value), dateEl && dateEl.value, noteEl && noteEl.value);
                saveSalesRecords(); render(true);
                toast(progress.complete ? 'Zarejestrowano ostatnią dostawę. Zamówienie zrealizowane.' : 'Zapisano dostawę częściową.');
              } catch (err) { toast(err && err.message ? err.message : 'Nie udało się zapisać dostawy.'); }
              return;
            }
          """
          if "const salesDelivery = e.target.closest('[data-salesdelivery]')" not in s:
              if event_anchor not in s:
                  raise SystemExit("Nie znaleziono obsługi zdarzeń sprzedaży")
              s = s.replace(event_anchor, event_code + event_anchor, 1)

          old_save = "dueDate:val('dueDate'),delivery:val('delivery'),document:val('document'),documentNo:val('documentNo'),notes:val('notes'),"
          new_save = "dueDate:val('dueDate'),delivery:(previous.lines&&previous.lines.length&&previous.deliveries&&previous.deliveries.length?(salesDeliveryProgress(previous).complete?'Dostarczone':'Częściowo dostarczone'):val('delivery')),document:val('document'),documentNo:val('documentNo'),notes:val('notes'),"
          if old_save in s: s = s.replace(old_save, new_save, 1)

          old_header = "const header=['Data sprzedaży','Klient','Adres inwestycji','Towar / urządzenie','Brutto','Przychód netto','Koszt materiałów netto','Koszt robocizny netto','Szacowana marża netto','Kompletność marży','Zapłacono','Pozostało','Termin płatności','Dostawa','Dokument','Numer dokumentu'];"
          new_header = "const header=['Data sprzedaży','Klient','Adres inwestycji','Towar / urządzenie','Brutto','Przychód netto','Koszt materiałów netto','Koszt robocizny netto','Szacowana marża netto','Kompletność marży','Zapłacono','Pozostało','Termin płatności','Status dostawy','Historia dostaw','Dokument','Numer dokumentu'];"
          if old_header in s: s = s.replace(old_header, new_header, 1)
          old_row = "return [x.saleDate,x.client,x.site,x.items,x.gross,x.revenueNet,c.materialCost,c.laborCost,c.complete?c.margin:'',c.complete?'Kompletne':'Niepełne',salesPaidTotal(x),salesRemaining(x),x.dueDate,x.delivery,x.document,x.documentNo].map(quote).join(';');"
          new_row = """const deliveryLog=(x.deliveries||[]).map(ev=>`${ev.date||''}: ${x.lines&&x.lines[ev.lineIndex]?x.lines[ev.lineIndex].name:'pozycja'} x ${ev.qty}${ev.note?' ('+ev.note+')':''}`).join(' | ');
                return [x.saleDate,x.client,x.site,x.items,x.gross,x.revenueNet,c.materialCost,c.laborCost,c.complete?c.margin:'',c.complete?'Kompletne':'Niepełne',salesPaidTotal(x),salesRemaining(x),x.dueDate,x.delivery,deliveryLog,x.document,x.documentNo].map(quote).join(';');"""
          if old_row in s: s = s.replace(old_row, new_row, 1)

          p.write_text(s)
          print("Dodano ewidencję dostaw częściowych do rejestru sprzedaży.")
          PY
          cat > "$PROJECT_DIR/tests/sales_delivery.test.js" <<'EOF'
          const fs = require('fs'), vm = require('vm'), assert = require('assert');
          const source = fs.readFileSync('www/js/ui_offers.js', 'utf8');
          const start = source.indexOf('function salesDeliveredForLine(');
          const end = source.indexOf('function salesCostSummary(', start);
          assert(start >= 0 && end > start, 'Brak funkcji dostaw');
          const context = { Date, Math, Number, String, Array, Object, Error };
          vm.createContext(context); vm.runInContext(source.slice(start, end), context);
          const sale = { lines: [{name:'Kocioł',qty:2},{name:'Zasobnik',qty:1}] };
          let progress = context.salesAddDelivery(sale, 0, 1, '2026-11-06', 'WZ 1');
          assert.strictEqual(progress.delivered, 1);
          assert.strictEqual(progress.remaining, 2);
          assert.strictEqual(sale.delivery, 'Częściowo dostarczone');
          context.salesAddDelivery(sale, 1, 1, '2026-11-07', 'WZ 2');
          progress = context.salesAddDelivery(sale, 0, 1, '2026-11-08', 'WZ 3');
          assert.strictEqual(progress.complete, true);
          assert.strictEqual(sale.delivery, 'Dostarczone');
          assert.throws(() => context.salesAddDelivery(sale, 0, 0.1), /przekracza pozostałą dostawę/);
          assert.throws(() => context.salesAddDelivery(sale, 0, 0), /większą od zera/);
          console.log('OK: dostawy częściowe i kontrola ilości.');
          EOF
          node "$PROJECT_DIR/tests/sales_delivery.test.js"

      - name: Copy patched web assets into Android package and verify
        run: |
          cd "$PROJECT_DIR"
          npx cap copy android
          python3 - <<'PY'
          import os
          from pathlib import Path

          # Ten krok działa już wewnątrz PROJECT_DIR (cd wykonano wyżej).
          root = Path(".")
          base = root / "android/app/src/main/assets/public/js"
          ui = (base / "ui.js").read_text()
          pro = (base / "pro.js").read_text()

          order = [ui.find("{ k: '%s'" % k) for k in ("offers", "ai", "calc", "settings")]
          if any(x < 0 for x in order) or order != sorted(order):
              raise SystemExit("APK assets nadal mają błędną kolejność zakładek: " + repr(order))

          required = [
              "function proMa() { return true; }",
              "function proPlatny(id) { return false; }",
              "function proPodglad(id) { return false; }",
              "function proDoPlatnego(t) { return false; }",
          ]
          for marker in required:
              if marker not in pro:
                  raise SystemExit("APK assets nie zawierają odblokowania: " + marker)

          if "function proEkranPodgladu() {\n  return false;" not in pro:
              raise SystemExit("APK assets nadal blokują ekran edycji")

          print("WERYFIKACJA APK ASSETS OK: Biuro → Asystent → Kalkulatory → Ustawienia; wszystkie blokady PRO wyłączone.")
          PY

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR/android"
          gradle --no-daemon assembleDebug

      - name: Verify final APK contains unlocked assets
        run: |
          python3 - <<'PY'
          import os
          import zipfile
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])
          apk = root / "android/app/build/outputs/apk/debug/app-debug.apk"
          if not apk.is_file():
              raise SystemExit("Nie znaleziono wynikowego APK")

          with zipfile.ZipFile(apk) as z:
              ui = z.read("assets/public/js/ui.js").decode("utf-8")
              pro = z.read("assets/public/js/pro.js").decode("utf-8")

          order = [ui.find("{ k: '%s'" % k) for k in ("offers", "ai", "calc", "settings")]
          if any(x < 0 for x in order) or order != sorted(order):
              raise SystemExit("W gotowym APK kolejność zakładek jest nieprawidłowa: " + repr(order))

          for marker in (
              "function proMa() { return true; }",
              "function proPlatny(id) { return false; }",
              "function proPodglad(id) { return false; }",
              "function proDoPlatnego(t) { return false; }",
          ):
              if marker not in pro:
                  raise SystemExit("Gotowy APK nie zawiera wymaganej poprawki: " + marker)

          import re
          if not re.search(r"function\s+proEkranPodgladu\s*\(\s*\)\s*\{\s*return\s+false\s*;", pro):
              raise SystemExit("Gotowy APK nadal blokuje ekran edycji")

          print("GOTOWY APK ZWERYFIKOWANY: prawidłowa nawigacja i wyłączone blokady abonamentowe.")
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asystent-instalatora-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
