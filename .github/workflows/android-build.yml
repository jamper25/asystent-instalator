
name: Build Asystent Instalatora APK

on:
  push:
    paths:
      - 'asystent_instalatora_android_ci.zip'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract application project
        run: |
          test -f asystent_instalatora_android_ci.zip
          unzip -q asystent_instalatora_android_ci.zip
          test -f asystent_instalatora_rebuild/package.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-34" \
            "build-tools;34.0.0" \
            "platform-tools"

      - name: Install dependencies and run tests
        working-directory: asystent_instalatora_rebuild
        run: |
          npm install --no-audit --no-fund
          npm test

      - name: Synchronize Capacitor
        working-directory: asystent_instalatora_rebuild
        run: npx cap sync android

      - name: Build debug APK
        working-directory: asystent_instalatora_rebuild/android
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asystent-instalatora-debug-apk
          path: asystent_instalatora_rebuild/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
