
name: Build Asystent Instalatora APK

on:
  push:
    paths:
      - 'asystent_instalatora_android_ci.zip'
      - '.github/workflows/android-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract application project
        run: |
          unzip -q asystent_instalatora_android_ci.zip -d app-src

          PROJECT_DIR="$(dirname "$(find app-src -name package.json -not -path '*/node_modules/*' -print -quit)")"

          if [ -z "$PROJECT_DIR" ]; then
            echo "Nie znaleziono package.json"
            exit 1
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "Projekt: $PROJECT_DIR"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android SDK 35
        run: |
          sdkmanager \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "platform-tools"

      - name: Update Android build configuration
        run: |
          cd "$PROJECT_DIR/android"

          sed -i \
            "s/compileSdkVersion = 34/compileSdkVersion = 35/" \
            build.gradle

          sed -i \
            "s/com.android.tools.build:gradle:8.2.1/com.android.tools.build:gradle:8.6.1/" \
            build.gradle

          echo "Zaktualizowana konfiguracja:"
          grep -E "compileSdkVersion|targetSdkVersion|com.android.tools.build" build.gradle

      - name: Install dependencies
        run: |
          cd "$PROJECT_DIR"
          npm install --no-audit --no-fund

      - name: Check JavaScript syntax
        run: |
          cd "$PROJECT_DIR"
          node tools/check-syntax.js

      - name: Check project integrity
        run: |
          cd "$PROJECT_DIR"
          node tools/check-project-integrity.js

      - name: Test Buderus catalog
        run: |
          cd "$PROJECT_DIR"
          node tests/buderus_catalog.test.js

      - name: Synchronize Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR/android"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asystent-instalatora-debug-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
