
name: Build Asystent Instalatora APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.2.1'

      - name: Android SDK
        uses: android-actions/setup-android@v3

    - - name: Accept Android SDK licenses
        run: yes | sdkmanager --licenses

      - name: Install Android components
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Unpack application
        run: |
          mkdir app-src
          unzip -q asystent_instalatora_android_ci.zip -d app-src
          PROJECT_DIR=$(find app-src -name package.json -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      - name: Install dependencies
        working-directory: .
        run: |
          cd "$PROJECT_DIR"
          npm install

      - name: Sync Capacitor
        run: |
          cd "$PROJECT_DIR"
          npx cap sync android

      - name: Build APK
        run: |
          cd "$PROJECT_DIR/android"
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: asystent-instalatora-debug-apk
          path: app-src/**/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
